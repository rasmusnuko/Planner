services:
  planner:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - planner_data:/data
    environment:
      DATABASE_PATH:  /data/planner.db
      # Change DB_PASSWORD and ADMIN_PASSWORD before first run!
      DB_PASSWORD:    "change-this-db-key"      # SQLite file encryption key
      ADMIN_PASSWORD: "change-this-admin-pw"    # Admin panel password (/admin-login)
    restart: unless-stopped

volumes:
  planner_data:
